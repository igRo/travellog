name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm prune --omit=dev
      - name: Package production release
        run: |
          mkdir -p "$RUNNER_TEMP/travellog-release/data"
          cp server.mjs package.json package-lock.json "$RUNNER_TEMP/travellog-release/"
          cp data/trips.example.json "$RUNNER_TEMP/travellog-release/data/"
          cp -a dist node_modules "$RUNNER_TEMP/travellog-release/"
          tar -C "$RUNNER_TEMP/travellog-release" -czf "$RUNNER_TEMP/travellog-release.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: travellog-release
          path: ${{ runner.temp }}/travellog-release.tar.gz
          retention-days: 3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: travellog-release
          path: ${{ runner.temp }}
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          release_id="$GITHUB_SHA"
          scp "$RUNNER_TEMP/travellog-release.tar.gz" "$VPS_USER@$VPS_HOST:/tmp/travellog-$release_id.tar.gz"
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_ID=$release_id bash -s" <<'REMOTE'
          set -euo pipefail
          app_dir=/opt/travellog
          release="$app_dir/releases/$RELEASE_ID"
          mkdir -p "$release"
          tar -xzf "/tmp/travellog-$RELEASE_ID.tar.gz" -C "$release"
          rm "/tmp/travellog-$RELEASE_ID.tar.gz"
          ln -s "$release" "$app_dir/current.next"
          mv -Tf "$app_dir/current.next" "$app_dir/current"
          sudo systemctl restart travellog
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 3 http://127.0.0.1:3001/api/trips >/dev/null
          mapfile -t old_releases < <(find "$app_dir/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +4 | cut -d' ' -f2-)
          for old_release in "${old_releases[@]}"; do
            rm -rf -- "$old_release"
          done
          REMOTE